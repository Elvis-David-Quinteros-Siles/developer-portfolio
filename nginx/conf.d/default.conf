# Edge: único punto de entrada publicado. Enrutamiento según docs/CONTRACTS.md §2.

upstream frontend_up { server frontend:8080; keepalive 16; }
upstream gateway_up  { server gateway:8080;  keepalive 16; }

# Para WebSocket/upgrades futuros
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    http2 on;

    # Cabeceras de seguridad (equivalente Helmet a nivel edge)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Propagación de correlación
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://gateway_up;
        proxy_read_timeout 30s;
    }

    location = /graphql {
        proxy_pass http://gateway_up;
        proxy_read_timeout 30s;
    }

    location /media/ {
        proxy_pass http://gateway_up;
        proxy_cache_valid 200 10m;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://frontend_up;
    }
}
