# Servidor SPA para nginx-unprivileged (escucha en 8080, sin root).
# El proxy hacia /api, /graphql y /media lo hace el nginx edge (ver CONTRACTS.md §2).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    # Seguridad básica (el edge puede añadir más)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash en el nombre: cache inmutable agresiva
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fuentes y estáticos versionados fuera de /assets
    location ~* \.(?:woff2?|ttf|otf)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta desconocida sirve index.html (sin cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
