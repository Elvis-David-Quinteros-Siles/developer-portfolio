name: portfolio

# ------------------------------------------------------------------------------
# Topología: ver docs/CONTRACTS.md §1. Solo nginx publica puertos.
# Redes segmentadas: edge (público), internal (APIs), data (estado).
# ------------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- edge -----
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Portfolio}
    restart: unless-stopped
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      GO_API_URL: http://go-api:8080
      GRAPHQL_API_URL: http://graphql-api:8000
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-100}
      RATE_LIMIT_CONTACT: ${RATE_LIMIT_CONTACT:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      go-api:
        condition: service_healthy
      graphql-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, internal, data]
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  # ------------------------------------------------------------- internal ----
  go-api:
    build: ./backend-go
    restart: unless-stopped
    environment:
      PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      DATABASE_URL: ${DATABASE_URL}
      GRAPHQL_API_URL: http://graphql-api:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      graphql-api:
        condition: service_healthy   # garantiza esquema migrado (ADR-0003)
    networks: [internal, data]
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default-logging

  graphql-api:
    build: ./backend-graphql
    restart: unless-stopped
    environment: &django-env
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-graphql-api,localhost}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    networks: [internal, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *default-logging

  celery-worker:
    build: ./backend-graphql
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *django-env
    depends_on:
      graphql-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    networks: [internal, data]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ----------------------------------------------------------------- data ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

networks:
  edge:
  internal:
  data:

volumes:
  pgdata:
  redisdata:
  media:
