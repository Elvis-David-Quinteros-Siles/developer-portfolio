name: backend-go

on:
  push:
    branches: [main]
    paths: ["backend-go/**", ".github/workflows/backend-go.yml"]
  pull_request:
    paths: ["backend-go/**", ".github/workflows/backend-go.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend-go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Docker build (incluye stage de tests)
        run: docker build -t portfolio-go-api .
