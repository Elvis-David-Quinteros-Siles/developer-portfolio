name: stack

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Compose up + smoke test end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar entorno
        run: |
          cp .env.example .env
          sed -i "s/change-me-strong-password/ci-$(openssl rand -hex 8)/g" .env
          sed -i "s/change-me-redis-password/ci-$(openssl rand -hex 8)/g" .env
          sed -i "s/change-me-jwt-secret-64-hex/$(openssl rand -hex 32)/" .env
          sed -i "s/change-me-internal-token/$(openssl rand -hex 32)/" .env
          sed -i "s/change-me-django-secret/$(openssl rand -hex 32)/" .env
          sed -i "s/change-me-admin-password/ci-$(openssl rand -hex 8)/" .env
      - name: Levantar stack completo
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: sh scripts/smoke-test.sh http://localhost
      - name: Logs si falla
        if: failure()
        run: docker compose ps && docker compose logs --tail 100
