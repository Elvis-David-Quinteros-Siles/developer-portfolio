# ==============================================================================
# CI/CD GitOps: construye las imágenes, las publica en GHCR y actualiza los
# tags en k8s/. Argo CD hace el resto (ver docs/gitops.md).
#
# Este workflow NO despliega: solo escribe en el repositorio. El clúster nunca
# recibe credenciales de GitHub y GitHub nunca recibe el kubeconfig.
#
# Convive con los workflows por servicio (backend-go.yml, gateway.yml, etc.),
# que siguen siendo la puerta de calidad en pull request.
# ==============================================================================
name: ci

on:
  push:
    branches: [main]
    # Corta el bucle: el commit `deploy: <sha>` que hace el job `deploy` solo
    # toca k8s/**, así que no vuelve a disparar este workflow. Es la segunda
    # línea de defensa — un push hecho con GITHUB_TOKEN tampoco dispara
    # workflows, por diseño de GitHub Actions.
    paths-ignore:
      - "k8s/**"
      - "docs/**"
      - "**.md"
  # Reconstrucción manual de las cuatro imágenes (p. ej. tras un CVE en una
  # imagen base) sin necesidad de un commit vacío.
  workflow_dispatch:

# Un despliegue a la vez: dos ejecuciones concurrentes escribirían en k8s/ y la
# segunda perdería el push. No se cancela la que está en curso: abortarla a
# medias dejaría imágenes publicadas sin su commit de tag correspondiente.
concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: developer-portfolio

jobs:
  # --------------------------------------------------------------------------
  # 1. Qué servicios cambiaron. Evita reconstruir y republicar cuatro imágenes
  #    cuando solo se tocó el CSS del frontend.
  # --------------------------------------------------------------------------
  changes:
    name: Detectar servicios afectados
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
            backend-go:
              - 'backend-go/**'
            backend-graphql:
              - 'backend-graphql/**'
            all:
              - '.github/workflows/ci.yml'

      - name: Construir matriz
        id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Catálogo de servicios: contexto de build y build-args descubiertos
          # en los Dockerfiles. Solo el frontend declara ARG (VITE_APP_NAME);
          # los demás no aceptan ninguno.
          # celery-worker no aparece: comparte imagen con backend-graphql.
          all_services='[
            {"name":"frontend",        "context":"frontend",        "build_args":"VITE_APP_NAME=Portfolio"},
            {"name":"gateway",         "context":"gateway",         "build_args":""},
            {"name":"backend-go",      "context":"backend-go",      "build_args":""},
            {"name":"backend-graphql", "context":"backend-graphql", "build_args":""}
          ]'

          if [ "$FORCE_ALL" = "true" ] || echo "$CHANGED" | jq -e 'index("all")' >/dev/null; then
            services=$(echo "$all_services" | jq -c .)
          else
            services=$(echo "$all_services" \
              | jq -c --argjson changed "$CHANGED" '[.[] | select(.name as $n | $changed | index($n))]')
          fi

          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Servicios a construir: $services"

  # --------------------------------------------------------------------------
  # 2. Build + push a GHCR, en paralelo, con caché de capas por servicio.
  #    Los Dockerfiles de Go heredan de una stage `test`: si los tests fallan,
  #    la imagen ni siquiera llega a existir.
  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service.name }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar owner a minúsculas
        id: owner
        # GHCR rechaza mayúsculas en la ruta de la imagen y el owner real las
        # tiene. Se calcula en vez de hardcodearse para sobrevivir a un rename
        # del usuario o a un fork.
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.context }}
          push: true
          provenance: false
          build-args: ${{ matrix.service.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          # Caché de capas de Actions, aislada por servicio para que el build
          # del frontend no invalide el de Go.
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # --------------------------------------------------------------------------
  # 3. Actualizar los tags en k8s/ y commitear. Ese commit es el disparador
  #    real del despliegue: Argo CD lo detecta y sincroniza.
  # --------------------------------------------------------------------------
  deploy:
    name: Actualizar tags en k8s/
    needs: [changes, build]
    if: needs.changes.outputs.services != '[]' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Credenciales persistidas para poder hacer push con GITHUB_TOKEN.
          persist-credentials: true

      - name: Instalar kustomize
        env:
          KUSTOMIZE_VERSION: "5.4.3"
        run: |
          set -euo pipefail
          curl -sSfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f kustomize kustomize.tar.gz
          kustomize version

      - name: Normalizar owner a minúsculas
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: kustomize edit set image
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          OWNER: ${{ steps.owner.outputs.lc }}
        run: |
          set -euo pipefail
          cd k8s
          for name in $(echo "$SERVICES" | jq -r '.[].name'); do
            image="${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-${name}"
            echo "-> ${image}:${GITHUB_SHA}"
            kustomize edit set image "${image}=${image}:${GITHUB_SHA}"
          done
          echo "--- kustomization.yaml resultante ---"
          cat kustomization.yaml

      - name: Validar que el resultado sigue siendo aplicable
        run: kustomize build k8s/ > /dev/null

      - name: Commit y push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- k8s/; then
            echo "Sin cambios en k8s/: los tags ya apuntaban a ${GITHUB_SHA}."
            exit 0
          fi

          git add k8s/
          git commit -m "deploy: ${GITHUB_SHA}"

          # Reintento por si otro push llegó a main mientras construíamos.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push OK en el intento ${attempt}."
              exit 0
            fi
            echo "Push rechazado (intento ${attempt}); rebase y reintento."
            git pull --rebase origin main
          done
          echo "No se pudo hacer push tras 3 intentos." >&2
          exit 1
