# ==============================================================================
# Raíz de Kustomize. Es lo que sincroniza Argo CD (source.path: k8s) y lo que
# el CI modifica con `kustomize edit set image`.
#
# Validar en local:  kubectl kustomize k8s/
# Aplicar sin Argo:  kubectl apply -k k8s/
#
# NOTA: `secrets.yaml` NO aparece en `resources` a propósito. Está en
# .gitignore, así que ni existe en el repo ni Argo CD lo gestiona: se aplica a
# mano una sola vez (ver docs/gitops.md §3). `prune: true` no lo tocará porque
# prune solo borra recursos con la anotación de tracking de Argo CD.
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

# No se usa `commonLabels`/`labels`: cada manifiesto ya declara sus etiquetas y
# `commonLabels` las inyectaría también en los selectores (matchLabels y
# Service.selector), que deben permanecer mínimos e inmutables — cambiarlos
# después obliga a recrear el Deployment.

resources:
  - namespace.yaml
  - configmap.yaml
  - media-pvc.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - backend-go/deployment.yaml
  - backend-go/service.yaml
  - backend-graphql/deployment.yaml
  - backend-graphql/service.yaml
  - celery-worker/deployment.yaml

# Una entrada por imagen construida. celery-worker no aparece: comparte la
# imagen de backend-graphql, así que esa entrada actualiza ambos Deployments.
# El CI ejecuta, dentro de k8s/:
#   kustomize edit set image <name>=<name>:<sha>
images:
  - name: ghcr.io/elvis-david-quinteros-siles/developer-portfolio-frontend
    newTag: latest
  - name: ghcr.io/elvis-david-quinteros-siles/developer-portfolio-gateway
    newTag: latest
  - name: ghcr.io/elvis-david-quinteros-siles/developer-portfolio-backend-go
    newTag: latest
  - name: ghcr.io/elvis-david-quinteros-siles/developer-portfolio-backend-graphql
    newTag: latest
