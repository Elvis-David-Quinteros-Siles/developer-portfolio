# NodePort 30080: el nginx externo (Docker, fuera del clúster) hace proxy_pass
# de "/" a http://127.0.0.1:30080. Ver docs/gitops.md §7.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: portfolio
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
