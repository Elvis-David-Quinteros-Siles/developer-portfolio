# ClusterIP: lo consumen el gateway (/graphql, /media) y go-api (write-side).
apiVersion: v1
kind: Service
metadata:
  name: graphql-api
  labels:
    app.kubernetes.io/name: graphql-api
    app.kubernetes.io/part-of: portfolio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: graphql-api
  ports:
    - name: http
      port: 8000
      targetPort: http
