# ==============================================================================
# PLANTILLA de secretos. NO se aplica desde Kustomize ni la sincroniza Argo CD.
#
#   1) cp k8s/secrets.example.yaml k8s/secrets.yaml
#   2) sustituye los valores marcados con CAMBIA-ME
#   3) kubectl apply -f k8s/secrets.yaml
#
# `k8s/secrets.yaml` está en .gitignore: nunca llega al repositorio, así que
# Argo CD no lo gestiona y `prune: true` NO lo borrará (prune solo elimina
# recursos con la anotación de tracking de Argo CD).
#
# Sustituye 203.0.113.10 por la IP privada/pública del VPS donde siguen
# corriendo los contenedores de PostgreSQL y Redis fuera del clúster. Ambos
# deben publicar su puerto en el host (5432 y 6379) y aceptar conexiones desde
# la red de pods de k3s (10.42.0.0/16).
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio
  labels:
    app.kubernetes.io/part-of: portfolio
type: Opaque
stringData:
  # --- Datos: apuntan al VPS, no a un Service del clúster ----------------------
  DATABASE_URL: "postgres://portfolio:CAMBIA-ME-POSTGRES-PASSWORD@203.0.113.10:5432/portfolio?sslmode=disable"
  REDIS_URL: "redis://:CAMBIA-ME-REDIS-PASSWORD@203.0.113.10:6379/0"

  # --- Seguridad (openssl rand -hex 32) ---------------------------------------
  JWT_SECRET: "CAMBIA-ME-jwt-secret-64-hex"
  INTERNAL_SERVICE_TOKEN: "CAMBIA-ME-internal-token"
  DJANGO_SECRET_KEY: "CAMBIA-ME-django-secret"

  # --- Admin único -------------------------------------------------------------
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "CAMBIA-ME-admin-password"

  # --- Opcional: vacío = verificación ReCaptcha deshabilitada ------------------
  RECAPTCHA_SECRET_KEY: ""
