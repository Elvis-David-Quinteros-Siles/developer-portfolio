# Worker de Celery. Usa EXACTAMENTE la misma imagen que graphql-api (mismo
# Dockerfile, mismo contexto de build): lo único que cambia es el comando. Por
# eso el CI construye 4 imágenes y no 5, y `images:` del kustomization tiene 4
# entradas: al actualizar backend-graphql, worker y API avanzan juntos y no
# pueden desincronizarse.
#
# Se usa `args` y no `command`: así se respeta el ENTRYPOINT del Dockerfile
# (/app/entrypoint.sh), que tiene una rama específica para celery — espera a la
# DB y hace exec sin volver a migrar ni sembrar (eso es tarea de graphql-api).
#
# Sin Service: el worker no recibe tráfico entrante, solo consume de Redis.
# strategy: Recreate por el PVC ReadWriteOnce compartido con graphql-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/part-of: portfolio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
        app.kubernetes.io/part-of: portfolio
    spec:
      securityContext:
        # El Dockerfile declara `USER app` — un NOMBRE, que el kubelet no puede
        # verificar contra `runAsNonRoot`. `adduser --system` le asigna
        # uid 100 / gid 101, y `chown -R app:app /app` deja ahí los permisos.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        # Da al PVC de media el grupo del usuario app, para que pueda escribir
        # los uploads del admin.
        fsGroup: 101
      containers:
        - name: celery-worker
          image: ghcr.io/elvis-david-quinteros-siles/developer-portfolio-backend-graphql:latest
          imagePullPolicy: IfNotPresent
          args:
            - celery
            - -A
            - config
            - worker
            - --loglevel=info
            - --concurrency=2
          env:
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: DJANGO_ALLOWED_HOSTS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: REDIS_URL
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: DJANGO_SECRET_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: ADMIN_PASSWORD
            - name: RECAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: RECAPTCHA_SECRET_KEY
          volumeMounts:
            - name: media
              mountPath: /app/media
          # No hay endpoint HTTP: el único chequeo real es preguntarle al propio
          # worker por AMQP/Redis. Cada probe levanta un proceso Python, así que
          # los periodos son largos a propósito (VPS pequeño). Si hace falta
          # recortar coste, la readinessProbe es la prescindible: sin Service,
          # solo sirve para que `rollout status` y la salud en Argo CD sean
          # veraces.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping -d "celery@$HOSTNAME" | grep -q pong
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping -d "celery@$HOSTNAME" | grep -q pong
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping -d "celery@$HOSTNAME" | grep -q pong
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 448Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: portfolio-media
